# question: For each subject in cohort B, how many sessions do they have?
ast_version: 1
name: sessions per subject in cohort B
scheme: default
sets:
  scope:  {grain: cohort, where: [["=", {}, ["field", {}, "name"], "ms-cohort-b"]]}
  people: {grain: subject, of: scope}
  visits: {grain: session, of: people}
  per_subject:
    grain: group
    group: {of: visits, by: [["field", {}, "subject.code"]]}
    bind: {n: ["count", {set: visits}]}
keep: [per_subject]
out:
  set: per_subject
  level: aggregate
  columns: [["field", {}, "subject.code"], ["field", {}, "n"]]
  order: [[["field", {}, "subject.code"], asc]]
