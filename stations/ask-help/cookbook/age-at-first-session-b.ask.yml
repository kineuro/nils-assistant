# question: How old was each subject of cohort B at their first session?
ast_version: 1
name: age at the first session in cohort B
scheme: default
sets:
  scope:  {grain: cohort, where: [["=", {}, ["field", {}, "name"], "ms-cohort-b"]]}
  people: {grain: subject, of: scope}
  visits:
    grain: session
    of: people
    bind:
      n:   ["ordinal", {}]
      age: ["age_at", {}, ["field", {}, "subject.birth_date"], ["field", {}, "first"]]
  first:
    grain: session
    from: visits
    where: [["=", {}, ["field", {}, "n"], 1]]
keep: [first]
out:
  set: first
  level: record
  columns: [["field", {}, "subject.code"], ["field", {}, "first"], ["field", {}, "age"]]
  order: [[["field", {}, "subject.code"], asc]]
