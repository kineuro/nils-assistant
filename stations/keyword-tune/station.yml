# SPDX-License-Identifier: AGPL-3.0-only
# keyword-tune (Wave 4c section 9.13, record 26), as contracts/suite/v1/station.schema.json fixes a manifest.
# The desk's headless runner (POST /assistant/stations/keyword-tune/runs) sends one message naming the
# scope, `scope: batch:<id>` (or origin:<name>, pack:<version>), and may add `list: <axis>.<value>` or a
# bucket's name, and `term: <word>` in the person's words; the run tunes one list of either kind.
id: keyword-tune
app: nils-assistant
purpose: assistant.keyword-tune
content: rows
ceiling: reviewer
grant:
  classify/signals:
    calls: 6
  classify/try:
    calls: 6
  packs/{name}:
    calls: 3
  review:
    calls: 4
  review/{id}:
    calls: 8
  overlays:
    calls: 2
  overlays/{id}:
    calls: 2
brief:
  path: SKILL.md
  hash: 12e275434c8521f28c74d8f62dfbc2d3eb6d18481b9a27d6c41ef561de5b662a
result:
  type: object
  required:
  - axis
  - list
  - sentence
  - diff
  properties:
    axis:
      type: string
    list:
      type: string
      description: the list the change touches, as the overlay names it, a bucket's name or axis.value
    bucket:
      type:
      - string
      - "null"
      description: the bucket the pack names, when the change is to a bucket
    value:
      type:
      - string
      - "null"
      description: the axis value whose word list changes, when the change is to a value's list
    overlay:
      type: object
      description: the overlay document rehearsed, one list of one pack, under buckets or under lists as axis.value
    prediction:
      type: object
      description: the hypothesis as written before the rehearsal
    rehearsal:
      type: object
      description: what try answered, the moves per axis and the review items that would close and open
    diff:
      type: string
      enum:
      - keep
      - partial
      - revert
    proposal:
      type: object
      description: the overlay id and the review item beside it, when one was proposed
    sentence:
      type: string
checks:
- one_file
- prediction_before_rehearsal
- rehearsal_wrote_nothing
- groups_exist
budget:
  turns: 10
  tool_calls: 30
  wall_clock_seconds: 180
  input_tokens: 200000
writes:
- overlay
- review_decision
phases:
  initial: survey
  follow_up: hypothesise
  transitions:
  - from: survey
    to: hypothesise
  - from: hypothesise
    to: rehearse
  - from: rehearse
    to: check
  - from: check
    to: hypothesise
  - from: check
    to: finish
evals: evals
