# question: What share of the subjects in cohort A are female?
ast_version: 1
name: the share of women in cohort A
scheme: default
sets:
  scope:  {grain: cohort, where: [["=", {}, ["field", {}, "name"], "ms-cohort-a"]]}
  people: {grain: subject, of: scope}
  by_sex:
    grain: group
    group: {of: people, by: [["field", {}, "sex"]]}
    bind:
      subjects: ["count", {set: people}]
      share:    ["share", {of: subjects, over: people}]
keep: [by_sex]
out:
  set: by_sex
  level: aggregate
  columns: [["field", {}, "sex"], ["field", {}, "subjects"], ["field", {}, "share"]]
  order: [[["field", {}, "sex"], asc]]
