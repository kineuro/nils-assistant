# question: List them, with the subject code and the session date.
ast_version: 1
name: sessions of cohort A with a 1 mm MPRAGE, listed
scheme: default
sets:
  scope:  {grain: cohort, where: [["=", {}, ["field", {}, "name"], "ms-cohort-a"]]}
  people: {grain: subject, of: scope}
  visits: {grain: session, of: people}
  mprage:
    grain: stack
    of: visits
    where:
      - ["=", {}, ["axis", {}, "technique"], "MPRAGE"]
      - ["~=", {tol: 0.05}, ["field", {}, "slice_thickness"], 1.0]
  found:
    grain: session
    from: visits
    has: [{set: mprage, min: 1}]
keep: [found]
out:
  set: found
  level: record
  columns: [["field", {}, "subject.code"], ["field", {}, "first"]]
  order: [[["field", {}, "subject.code"], asc], [["field", {}, "first"], asc]]
