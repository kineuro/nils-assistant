# question: List every session of cohort B with the subject code and the session date, ordered by subject and then by date.
ast_version: 1
name: the sessions of cohort B
scheme: default
sets:
  scope:  {grain: cohort, where: [["=", {}, ["field", {}, "name"], "ms-cohort-b"]]}
  people: {grain: subject, of: scope}
  visits: {grain: session, of: people}
keep: [visits]
out:
  set: visits
  level: record
  columns: [["field", {}, "subject.code"], ["field", {}, "first"]]
  order: [[["field", {}, "subject.code"], asc], [["field", {}, "first"], asc]]
