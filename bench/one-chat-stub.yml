# The answers bench/one-chat-stub.ts gives as an oracle, by
# `<conversation>#<turn>` (1-based): plain words a person should read, each
# holding what its turn's `says` and `sentences` ask, with no door phrase,
# engine word or step word. A turn without one answers "Here it is.". The
# numbers are the stub's own, not the registry's.
answers:
  "summary-cohorts#1": "There are two cohorts: cohort A with 24 people and cohort B with 24 people."
  "summary-scores#1": "The registry records EDSS and SDMT scores."
  "summary-courses#1": "You can filter on the relapsing course (RRMS) and the secondary progressive course (SPMS)."
  "summary-scan-kinds#1": "You can search by technique, for example MPRAGE, FLAIR and TSE, and by field strength."
  "summary-third-cohort#1": "There are three cohorts now; the newest is nmosd, with nine people."
  "run-synthseg#1": "4 units failed: two had no T1 to read, one stopped with an error and one reported nothing. Seven results look doubtful and are open for review."
  "run-samseg#1": "Every unit finished. 2 results fall outside the expected intracranial range and are open for review."
  "run-clean-mriqc#1": "All units succeeded and no result needs a second look."
  "none-als-analysis#1": "There is no ALS cohort in the registry, so there is nothing to measure yet."
  "none-als-count#1": "There is no ALS cohort in the registry."
  "find-main-scans#1": "NILS has picked 5 main T1w scans, 4 main FLAIR scans and 5 main T2w scans."
  "summary-dataset#1": "ds-clean holds 8 scans from 4 subjects over 8 visits, all of them sure."
  "summary-dataset#2": "ds-clean holds 2 T1 scans its headers mark as given contrast; there may be more until post-contrast runs on it."
