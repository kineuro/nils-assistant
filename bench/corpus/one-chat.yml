  # --- the analysis workspace (2026-10-12): rows of a question the person
  #     can see are put into an offline workspace as CSV and worked on with
  #     Python's standard library, xan and the chart command; a chart reaches
  #     the person as an image and a table as a file to download. Below the
  #     person's level a column comes as shapes and is left out, and an
  #     analysis that needs it is refused; text planted in the registry stays
  #     a value. The plain reader holds query:see at detail plain. These ask
  #     about the seeded registry's cohorts nmosd and ms-cohort-a, whose
  #     scans the seed reads; the trial of 2026-10-10 asked about
  #     ds-clean, whose copy the seed pseudonymises but never reads, so it
  #     holds no scans.
  - id: table-count-by-group
    kind: table
    registry: seeded
    from: authored, the analysis workspace
    turns:
      # a count per group is a question of its own (the skill's rule), so either path holds
      - say: Analyse the scans of nmosd and count them by base contrast.
        expect:
          skill: any
          tools: {none: [plan_update]}
          proposal: false
          says: [{match: "\\b\\d+\\b"}, {match: "\\bT1w?\\b"}]

  - id: table-mean-by-group
    kind: table
    registry: seeded
    from: authored, the analysis workspace
    turns:
      - say: Analyse ms-cohort-a for me. What is the mean and the median number of slices of its scans per base contrast?
        expect:
          skill: analyse-table
          also: [find-data]
          tools: {some: [analysis_table], none: [plan_update]}
          proposal: false
          says: [{match: "\\b(mean|average)\\b"}, {match: "\\bmedian\\b"}]

  - id: table-shapes-refusal
