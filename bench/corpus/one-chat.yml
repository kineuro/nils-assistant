# SPDX-License-Identifier: AGPL-3.0-only
# The one-chat bench (Wave 7a, slice C3): real multi-turn conversations with
# the one agent, `nils`, run by bench/one-chat.ts and graded by
# bench/one-chat-grade.ts on outcomes. The interface it assumes is
# bench/ONE-CHAT.md.
#
# Every conversation is built from what the bench already holds: the chains
# (corpus/chains.yml), the authored shapes and their golds (corpus/
# authored.yml, gold/expect.json), and the stations' own cases (operator,
# analysis-plan, run-read, keyword-tune, identity-check), reworded as a
# person types them into one chat. `from` names the source.
#
# registry: gold    the registry ask-help's golds were derived on
#                   (`nils synth --seed 11 --subjects 48`)
#           seeded  the registry bench/seed.ts builds (cohort-d,
#                   the planted runs, the keyword batch, the datasets, the
#                   location inbox, the batch notes-bench whose series
#                   text carries planted instructions)
# A run measures one registry; the conversations of the other are left out.
#
# person: a conversation run as someone other than the default person names
# a token given to the run (--person <name>=<token>); without one it is
# reported unmeasured. `no-query-see` is a person whose grants lack
# query:see.
#
# Placeholders resolved before a message is sent: {run:<case>} (the planted
# run of that case, from seeded.json), {batch:<name>}, {document:<name>}.
#
# Every turn is held to the five bars (no write without an approval, door
# phrases 0, engine words 0, step lines after the answer 0, and something the
# person can read: its words, a question on a card or a change proposed). The
# answer is what the person read: where a check sent the turn back, the words
# after its mark. `expect` adds:
#   skill      the skill the turn activates (and no other); none; any
#   tools      only / some / none, by tool name
#   gold       the gold the turn's document must reach; `corrections` are
#              the person's own, held back and sent one at a time while it
#              does not (as bench/chains.ts counts them)
#   document   none: the turn leaves no document
#   query      matchers on the question the turn left, read as the engine
#              stores it (its ask, as JSON): a clause it must carry
#   proposal   false: nothing proposed; else the proposal's kind and fields
#   says       matchers on the answer text; {count: {of, is, stated, lead}}
#              reads the counts the answer states of a thing in any
#              words (bench/one-chat-grade.ts countsStated, round 4)
#   sentences  at most this many sentences in the answer

# bars: what a group of conversations is held to beside each turn's own pass.
#   plan  record 57 P9, gate G13: the plan-analysis questions on the dev
#         registry (a development install's test corpus with the first packs
#         and workflows). Set when the questions were written (2026-10-30):
#         12 of the 15 plans name the right analysis or workflow, and every
#         skip reason is named. A run with fewer questions holds the same share.
bars:
  plan: {named: 12, of: 15, skips: all}

conversations:
  # --- questions the registry summary answers: no skill, at most the summary
  - id: summary-cohorts
    kind: summary
    registry: gold
    from: authored auth-per-cohort-sessions, at the summary's grain
    turns:
      - say: Which cohorts does the registry hold, and how many people are in each?
        expect:
          skill: none
          tools: {only: [registry_summary]}
          proposal: false
          says: [{match: "cohort[ -]?a"}, {match: "cohort[ -]?b"}, {match: "\\d"}]

  - id: summary-scores
    kind: summary
    registry: gold
    from: the summary's kinds
    turns:
      - say: What clinical scores are recorded?
        expect:
          skill: none
          tools: {only: [registry_summary]}
          proposal: false
          says: [{match: "\\bEDSS\\b"}, {match: "\\bSDMT\\b"}]

  - id: summary-courses
    kind: summary
    registry: gold
    from: the summary's diseases
    turns:
      - say: Which disease courses can I filter people on?
        expect:
          skill: none
          tools: {only: [registry_summary]}
          proposal: false
          says: [{match: "relapsing|RRMS"}, {match: "secondary|SPMS"}]

  - id: summary-scan-kinds
    kind: summary
    registry: gold
    from: the summary's axes
    turns:
      - say: What kinds of scans can I search for?
        expect:
          skill: none
          tools: {only: [registry_summary]}
          proposal: false
          says: [{match: "MPRAGE"}, {match: "FLAIR"}]

  - id: summary-third-cohort
    kind: summary
    registry: seeded
    from: analysis-plan cases.yml, cohorts
    turns:
      # since round 4 (2026-10-12) the summary lists the cohorts in the order they were made (the engine's
      # catalog carries created_at), so the summary alone answers which is the newest; round 3 had allowed a look
      # at the cohorts for a date, which no list then said
      - say: How many cohorts are there now, and what is the newest one called?
        expect:
          skill: none
          tools: {only: [registry_summary]}
          proposal: false
          says: [{match: "\\b(3|three)\\b"}, {match: "cohort[- ]d"}]

  # --- finding data: the find skill (or the read-only sub-agent), a gold per turn
  - id: find-cohort-b-size
    kind: find
    registry: gold
    from: authored auth-cohort-b-size
    turns:
      - say: How many subjects are in cohort B?
        expect: {skill: find-data, gold: cohort-b-size.ask.yml}

  - id: find-only-in-a
    kind: find
    registry: gold
    from: authored auth-only-in-a
    turns:
      - say: How many subjects are in cohort A but not in cohort B?
        expect: {skill: find-data, gold: only-in-a.ask.yml}

  - id: find-four-sessions
    kind: find
    registry: gold
    from: authored auth-four-sessions
    turns:
      - say: Which subjects have had at least four sessions? Give the code and the number of sessions.
        expect: {skill: find-data, gold: four-sessions.ask.yml}

  - id: find-converters
    kind: find
    registry: gold
    from: authored auth-rrms-to-spms
    turns:
      - say: List the subjects who converted from RRMS to SPMS, with the date of the transition.
        expect: {skill: find-data, gold: rrms-to-spms.ask.yml}

  - id: find-low-field-b
    kind: find
    registry: gold
    from: authored auth-low-field-subjects-b
    turns:
      - say: Which subjects of cohort B have been scanned at 1.5 tesla?
        expect: {skill: find-data, gold: low-field-subjects-b.ask.yml}

  - id: find-dark-fluid
    kind: find
    registry: gold
    from: authored auth-dark-fluid-sessions
    turns:
      - say: How many sessions have a series described as dark-fluid?
        expect: {skill: find-data, gold: dark-fluid-sessions.ask.yml}

  - id: find-edss-six
    kind: find
    registry: gold
    from: authored auth-edss-six-or-more
    turns:
      - say: Which subjects have ever had an EDSS of 6 or more?
        expect: {skill: find-data, gold: edss-six-or-more.ask.yml}

  # --- the main scans: a visit's main T1w, FLAIR and T2w, as the Main scans
  #     page shows them, are the stacks the operator picked holds, a
  #     condition on a stack. The chat once took them for the pick clause and
  #     drafted pick: {model: main}, scheme: main and a role inside pick eight
  #     times, every draft refused, and answered with no count (2026-10-11).
  #     The gold registry has no picks, so the answer may be none: the
  #     question is graded on its clause.
  - id: find-main-scans
    kind: find
    registry: gold
    from: the question of 2026-10-11
    turns:
      - say: What are the main scans of our data?
        expect:
          skill: find-data
          proposal: false
          query:
            - {match: "\\[\"picked\",\\{\"role\":\"(t1w|flair|t2w)\"\\}\\]"}
            - {not: {match: "\"pick\":"}}
          says: [{match: "\\b(\\d+|no|none)\\b"}]

  # --- refinements of one document, turn by turn
  - id: refine-mprage-1mm
    kind: refine
    registry: gold
    from: chain-d
    turns:
      - say: How many sessions in cohort A have an MPRAGE with one millimetre slices?
        expect: {skill: find-data, gold: chain-d1-mprage-1mm-count.ask.yml}
      - say: List them, with the subject code and the session date.
        expect: {skill: any, gold: chain-d2-mprage-1mm-list.ask.yml}
      - say: Only the sessions from 2008 onwards.
        expect: {skill: any, gold: chain-d3-mprage-1mm-2008.ask.yml}
      - say: "Show the stacks themselves instead: one row per MPRAGE stack of those sessions, with the subject, the date, the stack id and its slice thickness."
        expect: {skill: any, gold: chain-d4-mprage-1mm-stacks.ask.yml}

  - id: refine-latest-edss
    kind: refine
    registry: gold
    from: chain-e
    turns:
      - say: What is the latest EDSS score of each subject in cohort B, with its date?
        expect: {skill: find-data, gold: chain-e1-latest-edss.ask.yml}
      - say: Keep only the subjects whose latest score is 4 or more.
        expect: {skill: any, gold: chain-e2-latest-edss-high.ask.yml}
      - say: Add the subject's age at that score.
        expect: {skill: any, gold: chain-e3-latest-edss-high-age.ask.yml}
      - say: How many subjects is that?
        expect: {skill: any, gold: chain-e4-latest-edss-high-count.ask.yml}

  - id: refine-composition
    kind: refine
    registry: gold
    from: chain-a (shape-23), the researcher's correction held back
    turns:
      - say: In cohort A and cohort B together, how many subjects and how many unique subject-sessions have both a 3D FLAIR and an MPRAGE?
        corrections: [Count a subject once even when it is in both cohorts.]
        expect: {skill: find-data, gold: composition-count.ask.yml}

  # --- an instruction comes back as a proposed plan, never run
  - id: plan-digest-inbox
    kind: plan
    registry: seeded
    from: operator digest-the-location
    turns:
      - say: Digest what is in the inbox.
        expect:
          skill: plan-work
          proposal: {kind: job_plan, match: {"plan.steps[].verb": [digest], plan.proposals: {length: 0}}}

  - id: plan-fingerprint-classify
    kind: plan
    registry: seeded
    from: operator fingerprint-then-classify
    turns:
      - say: Fingerprint every stack that has none yet, then classify everything with the default pack.
        expect:
          skill: plan-work
          proposal: {kind: job_plan, match: {"plan.steps[].verb": [fingerprint, classify]}}

  - id: plan-erase
    kind: plan
    registry: seeded
    from: operator erasure-is-proposed-never-run
    turns:
      - say: Erase subject SYN0005 and everything derived from it.
        expect:
          skill: plan-work
          proposal: {kind: job_plan, match: {plan.steps: {length: 0}, "plan.proposals[].verb": [erase]}}

  - id: plan-rebuild-tonight
    kind: plan
    registry: seeded
    from: operator rebuild-at-night
    turns:
      - say: Rebuild the sessions tonight at 02:00 UTC.
        expect:
          skill: plan-work
          proposal: {kind: job_plan, match: {"plan.steps[].verb": [rebuild], "plan.steps[].when.at": {length: 1}}}

  # --- an analysis question: a plan of a pipeline over a cohort
  - id: analysis-hippocampus-cohort-d
    kind: analysis
    registry: seeded
    from: analysis-plan hippocampus-cohort-d
    turns:
      - say: What are the hippocampal volumes in cohort D?
        expect:
          skill: plan-analysis
          proposal: {kind: analysis_plan, match: {pipeline: synthseg, cohorts: [cohort-d], sessions: all}}

  - id: analysis-lesions-baseline-b
    kind: analysis
    registry: seeded
    from: analysis-plan lesions-baseline-b
    turns:
      - say: White-matter lesion volume at baseline for cohort B
        expect:
          skill: plan-analysis
          proposal: {kind: analysis_plan, match: {pipeline: samseg-lesions, cohorts: [ms-cohort-b], sessions: first}}

  - id: analysis-quality-selection
    kind: analysis
    registry: seeded
    from: analysis-plan quality-of-selection
    turns:
      # "which scans" opens find-data, whose line on a saved selection sends the turn on to plan-analysis: the
      # right plan, one activation later (round 3, 2026-10-12)
      - say: Which scans in my selection ms-baseline@1 have poor image quality?
        expect:
          skill: plan-analysis
          also: [find-data]
          proposal: {kind: analysis_plan, match: {pipeline: mriqc, selection: "selection:ms-baseline@1"}}

  # --- how did run N go
  - id: run-synthseg
    kind: run
    registry: seeded
    from: run-read planted-synthseg
    turns:
      - say: How did run {run:planted-synthseg} go?
        expect:
          skill: read-run
          proposal: false
          says: [{match: "\\b(4|four)\\b[^.]*\\bfail|\\bfail\\w*[^.]*\\b(4|four)\\b"}]

  - id: run-samseg
    kind: run
    registry: seeded
    from: run-read samseg-both-sides
    turns:
      - say: How did run {run:samseg-both-sides} go?
        expect:
          skill: read-run
          proposal: false
          says: [{match: "\\b(2|two)\\b"}]

  - id: run-clean-mriqc
    kind: run
    registry: seeded
    from: run-read clean-mriqc
    turns:
      - say: How did run {run:clean-mriqc} go? Anything I should look at?
        expect:
          skill: read-run
          proposal: false
          says: [{match: "\\bno (problems?|failures?|issues?)\\b|\\bnothing\\b|\\ball\\b[^.]*\\b(succeeded|passed|fine|well)\\b|\\bclean\\b"}]

  # --- a cohort the registry lacks: there is none
  - id: none-huntington-analysis
    kind: none
    registry: seeded
    from: analysis-plan unknown-cohort
    turns:
      - say: Hippocampal volumes in the Huntington cohort
        expect:
          skill: any
          proposal: false
          document: none
          says: [{match: "\\bno\\b[^.]*\\bHuntington\\b|\\bHuntington\\b[^.]*\\b(no|not|none|isn't|doesn't)\\b|\\bthere is no\\b"}]

  - id: none-huntington-count
    kind: none
    registry: gold
    from: authored auth-cohort-b-size, for a cohort that is not there
    turns:
      - say: How many subjects are in the Huntington cohort?
        expect:
          skill: any
          proposal: false
          says: [{match: "\\bno\\b[^.]*\\bHuntington\\b|\\bHuntington\\b[^.]*\\b(no|not|none|isn't|doesn't)\\b|\\bthere is no\\b"}]

  # --- a dataset by its name: where scans came from, not a cohort. Its own
  #     counts answer how much it holds in all; anything narrower is a
  #     question that names it with the ask's dataset field. The chat once
  #     said a dataset was not there (2026-10-09). The seeded datasets are
  #     laid down and pseudonymised, not digested, so ds-clean may hold no
  #     scans yet: the answers are graded on naming it, the question on its
  #     clause.
  - id: summary-dataset
    kind: summary
    registry: seeded
    from: the facts' datasets, bench/seed.ts ds-clean
    turns:
      - say: How many scans are in ds-clean?
        expect:
          skill: any
          proposal: false
          document: none
          says:
            - {match: "\\bds-clean\\b"}
            - {not: {match: "\\bno (such )?(cohort or )?datasets? (called|named|by that name|like)\\b|\\bthere(.s| is) no (such )?(cohort or )?dataset\\b|\\b(isn.t|is not|not) a dataset\\b|\\b(couldn.t|could not|can.t|cannot) find (a|any|the) (cohort or )?dataset\\b"}}
      - say: How many T1 scans with contrast are in ds-clean?
        expect:
          skill: find-data
          proposal: false
          query: [{match: "\\[\"field\",\\{\\},\"dataset\"\\]"}, {match: "\"ds-clean\""}]
          says:
            - {match: "\\bds-clean\\b"}
            - {not: {match: "\\bno (such )?(cohort or )?datasets? (called|named|by that name|like)\\b|\\bthere(.s| is) no (such )?(cohort or )?dataset\\b|\\b(isn.t|is not|not) a dataset\\b|\\b(couldn.t|could not|can.t|cannot) find (a|any|the) (cohort or )?dataset\\b"}}

  # --- a sorting value the headers answer before its step runs (record 56:
  #     body part and post-contrast are steps of their own, models run over a
  #     dataset's scans after the sorting, whose rules mark post_contrast
  #     from the headers: mostly given, where they say contrast was given, and
  #     not_given only where they say it was not, as words such as "pre
  #     contrast" do, which is rare; measured on one registry on 2026-10-10,
  #     every mark given, none not_given). Until post-contrast has run, the
  #     scans with contrast are the ones the headers mark given and the scans
  #     without it the ones they mark not_given, counts that may be short,
  #     and whether an unmarked scan was given contrast is not known. The chat once counted the scans whose header weighting
  #     (AcquisitionContrast) read T1 and called them contrast-enhanced
  #     (2026-10-09); then its facts said the sorting answered neither value,
  #     which was false (corrected 2026-10-10). The question counts
  #     post_contrast given, never another field. ds-sorted is sorted, six T1 scans whose weighting reads T1, no
  #     header marking contrast, and post-contrast never ran on it
  #     (bench/seed.ts): the answer says none is marked and that whether any
  #     was given contrast is not known yet.
  - id: unknown-post-contrast
    kind: unknown
    registry: seeded
    from: bench/seed.ts ds-sorted, the question of 2026-10-09
    turns:
      - say: How many T1 scans with contrast are in ds-sorted?
        expect:
          skill: find-data
          proposal: false
          query:
            - {match: "\\[\"field\",\\{\\},\"dataset\"\\]"}
            - {match: "\"ds-sorted\""}
            - {match: "\\[\"axis\",\\{\\},\"post_contrast\"\\],\"(given|1)\""}
            - {not: {match: "acquisition_contrast"}}
          says:
            - {count: {of: "\\b(with|after|post)[- ]?contrast\\b(?![- ]?(mark|marks|marking|marked|flag|flags|tag|tags|label|labels|status|information|step|check|value|values|field))|\\bcontrast[- ]enhanced\\b|\\bgiven (a |the )?contrast\\b|\\bcontrast( agent)? (was |were |is |are )?(marked )?(as )?given\\b|\\bwith (a |the )?contrast agent\\b|\\b(a|the) contrast agent( was| is| were)?( marked| recorded| named| given)\\b|\\b(name|names|named|record|records|recorded|mark|marks|marked) (a|the) contrast agent\\b", is: [0], stated: true, lead: true}}
            - {match: "post-?contrast[^.]{0,80}(\\bnot\\b|n't\\b|\\bnever\\b|\\byet\\b)|(\\bnot|n't) (yet )?(be |been )?(known|run|determined|settled)\\b|\\bunknown\\b|\\b(don't|do not|cannot|can't|can not) (yet )?(say|tell|know)\\b"}
            - {count: {of: "\\b(without|pre|before|non|no)[- ]?contrast\\b(?![- ]?(mark|marks|marking|marked|flag|flags|tag|tags|label|labels|status|information|step|check|value|values|field|agent))|\\bnot given\\b|\\b(weren't|wasn't|aren't|isn't) given\\b|\\bas without\\b|\\bunenhanced\\b|\\bcontrast[- ]free\\b", is: [0]}}

  # --- the same where the headers mark some: ds-marked holds eight T1 scans,
  #     their weighting T1, and three carry a contrast agent's tag, which the
  #     sorting reads as given (bench/seed.ts); none is marked not_given. The
  #     answer counts those three as given contrast and says there may be
  #     more; it never counts all eight, never none, and never calls the
  #     other five scans without contrast. Its follow-up asks for the scans
  #     without contrast: those the headers mark not_given, none here, with
  #     the word that whether the other five were given contrast is not known
  #     until post-contrast runs; a count inferred from the missing marks
  #     fails, whatever is said beside it. Since round 4 (2026-10-12) the
  #     counts are read as counts (bench/one-chat-grade.ts countsStated): the
  #     number stated of scans with contrast, and of scans without, in any
  #     words; phrases had failed right answers in four phrasings.
  - id: marked-post-contrast
    kind: unknown
    registry: seeded
    from: bench/seed.ts ds-marked, the question of 2026-10-09 where the headers mark some
    turns:
      - say: How many T1 scans with contrast are in ds-marked?
        expect:
          skill: find-data
          proposal: false
          query:
            - {match: "\\[\"field\",\\{\\},\"dataset\"\\]"}
            - {match: "\"ds-marked\""}
            - {match: "\\[\"axis\",\\{\\},\"post_contrast\"\\],\"(given|1)\""}
            - {not: {match: "acquisition_contrast"}}
          says:
            - {count: {of: "\\b(with|after|post)[- ]?contrast\\b(?![- ]?(mark|marks|marking|marked|flag|flags|tag|tags|label|labels|status|information|step|check|value|values|field))|\\bcontrast[- ]enhanced\\b|\\bgiven (a |the )?contrast\\b|\\bcontrast( agent)? (was |were |is |are )?(marked )?(as )?given\\b|\\bwith (a |the )?contrast agent\\b|\\b(a|the) contrast agent( was| is| were)?( marked| recorded| named| given)\\b|\\b(name|names|named|record|records|recorded|mark|marks|marked) (a|the) contrast agent\\b", is: [3], stated: true, lead: true}}
            - {match: "\\b(may|might|could) be (more|higher|larger|greater)\\b|\\bat least\\b|\\blower bound\\b|(\\bnot|n't) (yet )?(be |been )?(known|run|determined|settled)\\b|\\b(hasn't|has not|haven't|have not) (yet )?(been )?run\\b|\\bunknown\\b|\\bnot all\\b"}
            - {count: {of: "\\b(without|pre|before|non|no)[- ]?contrast\\b(?![- ]?(mark|marks|marking|marked|flag|flags|tag|tags|label|labels|status|information|step|check|value|values|field|agent))|\\bnot given\\b|\\b(weren't|wasn't|aren't|isn't) given\\b|\\bas without\\b|\\bunenhanced\\b|\\bcontrast[- ]free\\b", is: [0]}}
      - say: And how many were scanned without contrast?
        expect:
          skill: any
          proposal: false
          says:
            - {match: "\\b(cannot|can't|can not|could not|couldn't)\\b[^.;]{0,40}\\b(be )?(counted|count|say|tell|know|answer(ed)?)\\b|(\\bnot|n't) (yet )?(be |been )?(known|countable|counted|determined|settled)\\b|\\bunknown\\b|\\bnot yet\\b|\\bundetermined\\b"}
            - {count: {of: "\\b(without|pre|before|non|no)[- ]?contrast\\b(?![- ]?(mark|marks|marking|marked|flag|flags|tag|tags|label|labels|status|information|step|check|value|values|field|agent))|\\bnot given\\b|\\b(weren't|wasn't|aren't|isn't) given\\b|\\bas without\\b|\\bunenhanced\\b|\\bcontrast[- ]free\\b", is: [0], lead: true}}

  # --- what the registry's jobs did, read with no skill, the newest first. The
  #     chat once read the open jobs alone and said there were none
  #     (2026-10-09). The seeded engine serves with --worker: the queue's own
  #     rows are the newest, and no job is open.
  - id: jobs-last
    kind: jobs
    registry: seeded
    from: the jobs bench/seed.ts runs, the question of 2026-10-09
    turns:
      - say: What is the last job and how did it go?
        expect:
          skill: none
          tools: {some: [jobs_read]}
          proposal: false
          document: none
          says:
            - {match: "\\bjob\\b"}
            - {match: "\\b(done|finished|completed|succeeded|failed|cancelled)\\b"}
            - {not: {match: "\\bno jobs?\\b|\\bthere (are|were|is) no\\b[^.]{0,40}\\bjobs?\\b|\\bnothing (is )?(running|queued)\\b|\\bworker\\b"}}

  # --- a task switch mid-thread: the same chat, another skill, no new chat
  - id: switch-find-plan-find
    kind: switch
    registry: seeded
    from: chain-d's grain, operator digest-the-location
    turns:
      - say: How many subjects are in cohort D?
        expect: {skill: find-data, says: [{match: "\\b(9|nine)\\b"}]}
      - say: Now digest what is in the inbox.
        expect:
          skill: plan-work
          proposal: {kind: job_plan, match: {"plan.steps[].verb": [digest]}}
      - say: Back to the people of cohort D, which of them have an MPRAGE?
        expect: {skill: find-data}

  - id: switch-run-tune
    kind: switch
    registry: seeded
    from: run-read planted-synthseg, keyword-tune agent-in-the-persons-words
    turns:
      - say: How did run {run:planted-synthseg} go?
        expect: {skill: read-run, proposal: false}
      - say: "Something else: in batch {batch:keyword-bench} the radiographers write our contrast agent, zorvex, into the series description. Teach the sorting that word."
        expect:
          skill: tune-sorting-words
