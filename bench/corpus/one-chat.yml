  # --- a thread of 2026-10-12, on a small registry of two datasets. Its
  #     faults: asked to remember the person's name, the chat said twice it
  #     had nowhere to keep a note, beside a Memory page that held one; asked
  #     for a CSV, it put a question on a card and wrote nothing; it said the
  #     list of a stack's fields it could read was cut off at kvp; and two
  #     runs that stopped before any unit, dcm2niix missing, read as runs in
  #     which no unit failed. Its good answers must keep passing: the
  #     scanner makers' words for kinds of scan (MEDIC, SPACE), what SyMRI
  #     makes, its magnitude and phase images (a check once sent the right
  #     answer back for the word phase), dual-echo PD and T2, and counts
  #     that name the question they were stored as. The name is made up.
  - id: memory-name
    kind: memory
    registry: gold
    from: the thread of 2026-10-12, the name to remember
    turns:
      - say: Remember that my name is Alva, so you have it in my other chats too.
        expect:
          skill: none
          tools: {some: [remember]}
          proposal: false
          document: none
          says:
            - {match: "\\b(kept|keep|keeping|remember|remembered|noted|saved)\\b"}
            - {not: {match: "\\b(can't|cannot|can not|unable to|not able to|no way to|nowhere to)\\b[^.]{0,40}\\b(remember|keep|store|write|save|carry|note|memory)\\b|\\bno (persistent |long-term )?memory\\b|\\bonly (lasts|holds) as long as\\b"}}
      - say: So you can put things into your memory?
        expect:
          proposal: false
          document: none
          says:
            - {match: "\\bmemory\\b|\\bMemory page\\b|\\bremember\\b"}
            - {match: "\\b(new|next|later|other) (conversations?|chats?)\\b|\\bstart of each\\b|\\beach new\\b"}
            - {not: {match: "\\b(can't|cannot|can not|unable to|not able to|no way to|nowhere to)\\b[^.]{0,40}\\b(remember|keep|store|write|save|carry|note|memory)\\b|\\bno (persistent |long-term )?memory\\b|\\bonly (lasts|holds) as long as\\b"}}
      - say: Thanks. Forget my name again, please.
        expect:
          tools: {some: [forget]}
          proposal: false
          document: none

