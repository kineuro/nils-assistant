          also: [find-data]
          proposal: false
          sentences: 3
          says: [{match: "\\b(shapes?|cannot|can't|not able|no access|isn't open|is not open)\\b"}, {not: {match: "\\b\\d+(\\.\\d+)? years\\b"}}]

